name: Build Container Image
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    strategy:
      matrix:
        arch: [amd64]

    permissions:
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          platforms: linux/${{ matrix.arch }}
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build from this repo and ref so the image contains the code being built
      - name: Set build context (APPS_JSON, FRAPPE_BRANCH, IMAGE_TAG)
        run: |
          REPO_URL="${{ github.server_url }}/${{ github.repository }}"
          REF="${{ github.ref_name }}"
          APPS_JSON="[{\"url\": \"${REPO_URL}\", \"branch\": \"${REF}\"}]"
          echo "APPS_JSON_BASE64=$(echo ${APPS_JSON} | base64 -w 0)" >> $GITHUB_ENV
          echo "FRAPPE_BRANCH=version-15" >> $GITHUB_ENV
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "IMAGE_TAG=${REF}" >> $GITHUB_ENV
          elif [[ "${REF}" == "main" ]]; then
            echo "IMAGE_TAG=stable" >> $GITHUB_ENV
          else
            echo "IMAGE_TAG=${REF}" >> $GITHUB_ENV
          fi

      - name: Checkout frappe_docker (build context)
        uses: actions/checkout@v4
        with:
          repository: frappe/frappe_docker
          path: builds

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          push: true
          context: builds
          file: builds/images/layered/Containerfile
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:${{ env.IMAGE_TAG }}
          build-args: |
            FRAPPE_BRANCH=${{ env.FRAPPE_BRANCH }}
            APPS_JSON_BASE64=${{ env.APPS_JSON_BASE64 }}
