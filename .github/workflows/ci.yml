name: Server Tests
on:
  pull_request: {}

permissions:
  contents: read

jobs:
  tests:
    name: Server Tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    services:
      redis-cache:
        image: redis:alpine
        ports:
          - 13000:6379
      redis-queue:
        image: redis:alpine
        ports:
          - 11000:6379
      redis-socketio:
        image: redis:alpine
        ports:
          - 12000:6379
      mariadb:
        image: anandology/mariadb-utf8mb4:10.3
        ports:
          - 3306:3306
        env:
          MYSQL_ROOT_PASSWORD: root
        options: --health-cmd="mysqladmin ping" --health-interval=5s --health-timeout=2s --health-retries=3
    steps:
    - uses: actions/checkout@v5
    - name: setup python
      uses: actions/setup-python@v6
      with:
        python-version: '3.14'
    - name: setup node
      uses: actions/setup-node@v6
      with:
        node-version: '24'
        check-latest: true
    - name: setup cache for bench
      uses: actions/cache@v4
      with:
        path: ~/bench-cache
        key: ${{ runner.os }}
    - name: install bench
      run: |
        pip3 install frappe-bench
        which bench
    - name: bench init
      run: |
        if [ -d ~/bench-cache/bench.tgz ]
        then
           (cd && tar xzf ~/bench-cache/bench.tgz)
        else
          bench init ~/frappe-bench --skip-redis-config-generation --skip-assets --python "$(which python)"
          mkdir -p ~/bench-cache
          (cd && tar czf ~/bench-cache/bench.tgz frappe-bench)
        fi
    - name: add payments app to bench
      working-directory: /home/runner/frappe-bench
      run: bench get-app https://github.com/frappe/payments
    - name: add lms app to bench
      working-directory: /home/runner/frappe-bench
      run: bench get-app lms $GITHUB_WORKSPACE
    - name: create bench site
      working-directory: /home/runner/frappe-bench
      run: bench new-site --mariadb-root-password root --admin-password admin frappe.local
    - name: pin setuptools for pkg_resources
      # The payments app pulls in `razorpay`, whose SDK imports pkg_resources --
      # removed in setuptools 81. Without this, `install-app lms` dies while
      # importing the Razorpay Settings module, before a single test runs, and
      # the failure names Razorpay rather than setuptools.
      #
      # This job last passed on 2026-04-10; the breakage is drift in the runner
      # image, not in this repository. Setuptools' own warning is the guidance
      # followed here: "Refrain from using this package or pin to Setuptools<81".
      #
      # The payments app is not removable to dodge this: `lms/hooks.py` declares
      # `required_apps = ["frappe/payments"]`, and production runs it.
      working-directory: /home/runner/frappe-bench
      run: ./env/bin/pip install 'setuptools<81'
    - name: install lms app
      working-directory: /home/runner/frappe-bench
      run: bench --site frappe.local install-app lms
    - name: setup requirements
      working-directory: /home/runner/frappe-bench
      run: bench setup requirements --dev
    - name: block endpoints
      working-directory: /home/runner/frappe-bench
      run: bench --site frappe.local set-config block_endpoints 1
    - name: allow tests
      working-directory: /home/runner/frappe-bench
      run: bench --site frappe.local set-config allow_tests true
    - name: bench build
      working-directory: /home/runner/frappe-bench
      run: bench --site frappe.local build
    # A `migrate` step was added here on 2026-11-13 and removed the same day.
    #
    # It was added because this job never runs a single patch -- `install-app`
    # neither runs `patches.txt` nor leaves patches pending, so patches are
    # marked applied without ever executing. That is a real gap, and it is why
    # an index added by a patch was absent here.
    #
    # It was removed again the same day, but NOT for the reason first recorded
    # here. That commit claimed `migrate` introduced 15 errors in unrelated
    # tests. Re-running after the revert showed the same 15 errors, so that
    # attribution was wrong -- and the local reproduction differs anyway: the
    # same module fails with `PermissionError not raised` locally and errors on
    # CI, which points at the environment rather than at `migrate`.
    #
    # It was removed because it does not do what it was added for: on a fresh
    # site `install-app` appears to mark patches applied without running them,
    # so `migrate` afterwards finds nothing pending. The index test no longer
    # needs it -- that test runs the patch itself and asserts the effect, so it
    # holds on a migrated and an un-migrated site alike.
    #
    # Two gaps remain, both pre-existing and neither fixed here:
    #   * the 15 errors in course_evaluator / lms_course / lms_live_class;
    #   * 16 fork test modules that import `frappe.tests.UnitTestCase`, a v16
    #     class absent from every v15, so they cannot be collected at all.
    - name: run tests
      working-directory: /home/runner/frappe-bench
      run: bench --site frappe.local run-tests --app lms --coverage
    - name: Upload coverage data
      uses: actions/upload-artifact@v4
      with:
        path: /home/runner/frappe-bench/sites/coverage.xml
